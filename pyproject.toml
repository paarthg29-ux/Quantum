[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qguc"
version = "0.1.0"
description = "Warm-started QAOA for multi-period unit commitment (Haryana case study)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["qguc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
